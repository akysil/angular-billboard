version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore", "area:ci"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore", "dependencies"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
